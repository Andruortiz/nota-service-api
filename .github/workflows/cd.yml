name: CD

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: note-service-api

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.data.outputs.version }}
      image_tag: ${{ steps.data.outputs.image_tag }}
      environment: ${{ steps.data.outputs.environment }}
      prerelease: ${{ steps.data.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format and ancestry
        id: data
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not follow SemVer pattern (expected vX.Y.Z or vX.Y.Z-rc.N)"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit does not belong to main branch. Production deployments are restricted to merged code."
            exit 1
          fi

          VERSION="${TAG#v}"
          SHA7="${GITHUB_SHA::7}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERSION}-${SHA7}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Run test suite
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      omit-sonar: true

  image:
    name: Build and publish container image
    needs: [validate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.name.outputs.reference }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "27"
          cache: "maven"

      - name: Package Application JAR
        run: ./mvnw package -DskipTests

      - name: Construct lowercase image registry reference
        id: name
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "reference=ghcr.io/${OWNER}/${IMAGE_NAME}:${{ needs.validate.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ needs.validate.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${{ steps.name.outputs.reference }}" .

      - name: Scan container for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.reference }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image to GHCR
        run: docker push "${{ steps.name.outputs.reference }}"

  deploy:
    name: Automatic deployment to ${{ needs.validate.outputs.environment }}
    needs: [validate, image]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate.outputs.environment }}
    steps:
      - name: Execute automated infrastructure deployment
        run: |
          echo "Deploying target version ${{ needs.validate.outputs.version }} to ${{ needs.validate.outputs.environment }}"
          echo "Pulling latest image: ${{ needs.image.outputs.reference }}"
          # TODO: Inserta aquí el comando de tu proveedor cloud (ej. kubectl set image, aws ecs, webhook, etc.)

  release:
    name: Publish GitHub release
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ARGS=(--generate-notes --title "$GITHUB_REF_NAME" --verify-tag)
          if [[ "${{ needs.validate.outputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${ARGS[@]}"
