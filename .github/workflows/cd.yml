name: CD

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: note-service-api

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.data.outputs.version }}
      image_tag: ${{ steps.data.outputs.image_tag }}
      environment: ${{ steps.data.outputs.environment }}
      prerelease: ${{ steps.data.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format and ancestry
        id: data
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not follow SemVer pattern"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag commit does not belong to master branch."
            exit 1
          fi

          VERSION="${TAG#v}"
          SHA7="${GITHUB_SHA::7}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERSION}-${SHA7}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Run test suite
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      omit-sonar: true

  image:
    name: Build and publish container image
    needs: [validate, ci]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      reference: ${{ steps.name.outputs.reference }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Package Application JAR
        run: ./mvnw package -DskipTests

      - name: Construct lowercase image registry reference
        id: name
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "reference=ghcr.io/${OWNER}/${IMAGE_NAME}:${{ needs.validate.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ needs.validate.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${{ steps.name.outputs.reference }}" .

      - name: Scan container for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.name.outputs.reference }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image to GHCR
        run: docker push "${{ steps.name.outputs.reference }}"

  deploy:
    name: Automatic deployment to ${{ needs.validate.outputs.environment }}
    needs: [validate, image]
    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.validate.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH access
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_deploy" \
            --exclude '.env' --exclude 'frontend/' --exclude 'vault-init.txt' \
            deploy/ "$TARGET:/opt/notas/"

      - name: Update services
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          API_IMAGE: ${{ needs.image.outputs.reference }}
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" "cd /opt/notas \
            && export API_IMAGE='$API_IMAGE' \
            && docker compose -f docker-compose.prod.yml pull api \
            && docker compose -f docker-compose.prod.yml up -d \
            && docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile"

      - name: Smoke test
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          for attempt in $(seq 1 18); do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://${PUBLIC_HOST}/api/v1/grupos" || true)"
            if [ "$STATUS" = "401" ]; then
              echo "API responding (401 without token), as expected"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $STATUS"
            sleep 10
          done
          echo "::error::API did not respond with 401 after deployment"
          exit 1

  release:
    name: Publish GitHub release
    needs: [validate, deploy]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ARGS=(--generate-notes --title "$GITHUB_REF_NAME" --verify-tag)

          if [[ "${{ needs.validate.outputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" "${ARGS[@]}"