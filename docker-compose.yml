services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${BD_NOMBRE:-notes}
      POSTGRES_USER: ${BD_USUARIO:-notes}
      POSTGRES_PASSWORD: ${BD_CLAVE:-notes}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BD_USUARIO:-notes} -d ${BD_NOMBRE:-notes}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_CLAVE:-admin}
    ports:
      - "8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

  vault:
    image: hashicorp/vault:1.18
    command: server -dev
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      - vault
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
      BD_USUARIO: ${BD_USUARIO:-notes}
      BD_CLAVE: ${BD_CLAVE:-notes}
    entrypoint:
      - sh
      - -c
      - >-
        until vault status > /dev/null 2>&1; do sleep 1; done;
        vault kv put secret/note-service-api
        spring.datasource.username="$$BD_USUARIO"
        spring.datasource.password="$$BD_CLAVE"

volumes:
  postgres-data:
  keycloak-data:
