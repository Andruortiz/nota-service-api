services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${BD_NOMBRE:-notes}
      POSTGRES_USER: ${BD_USUARIO:-notes}
      POSTGRES_PASSWORD: ${BD_CLAVE:-notes}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BD_USUARIO:-notes} -d ${BD_NOMBRE:-notes}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_CLAVE:-admin}
    ports:
      - "8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
  keycloak-data:
