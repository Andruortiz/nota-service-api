spring.application.name=note-service-api

spring.datasource.url=${BD_URL:jdbc:postgresql://localhost:5432/notes}
spring.datasource.username=${BD_USUARIO:}
spring.datasource.password=${BD_CLAVE:}

spring.jpa.hibernate.ddl-auto=update

logging.pattern.level=%5p [%X{correlationId:-}]

spring.cloud.vault.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081/realms/notes}
spring.security.oauth2.resourceserver.jwt.audiences=note-service-api
